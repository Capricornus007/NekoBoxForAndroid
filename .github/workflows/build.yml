name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
env:
  MIERU_VERSION: v3.34.1
  MDVPN_REF: android-vpnservice-protect-hook
  MDVPN_COMMIT: d481d72d4b86783a87d536c214d2c68cc4e9320e
  NAIVE_VERSION: v149.0.7827.114-1
  OLCRTC_REPO: https://github.com/hawkff/olcrtc.git
  OLCRTC_COMMIT: ad5cc1e3d60b657b15ccd26f8db91395bf9630d0
  PROTON_REPO: https://github.com/ProtonVPN/go-vpn-lib.git
  PROTON_COMMIT: 9440653831b00dbc4711f59e8a23a06af1999405
permissions:
  contents: read
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Golang Status
        run: find buildScript libcore -type f -name "*.sh" | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify 16 KB ELF alignment
        run: bash ./scripts/verify-elf-alignment.sh app/libs/libcore.aar
      - name: Upload LibCore
        uses: actions/upload-artifact@v7 # v7
        with:
          name: libcore-aar-build
          path: app/libs/libcore.aar
          retention-days: 1
          if-no-files-found: error
  sidecars:
    name: Native Build (Sidecars)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sidecars Status
        # singbox-sidecar.sh 的輸入不只它自己：COMMIT_SING_BOX（get_source_env.sh）與 build tag
        # 的來源（libcore/build.sh）任一個改了，libsingbox.so 的內容就跟著變。這兩個沒列進 key
        # 的話，快取會端出上一版的 sidecar 而整條鏈全綠 —— 本倉踩過同一型（key 漏檔案＝舊產物）。
        run: |
          # 註解必須寫在命令之前、不能插進反斜線續行中間：續行裡的 `#` 會把整條邏輯行的
          # 後半段一起註解掉，等於靜默少列檔案，正是這道 key 要防的那類錯。
          git ls-files -s -- \
            buildScript/lib/mieru.sh \
            buildScript/lib/masterdnsvpn.sh \
            buildScript/lib/naive.sh \
            buildScript/lib/olcrtc.sh \
            buildScript/lib/olcrtc-src/main.go \
            buildScript/lib/olcrtc-src/main_test.go \
            buildScript/lib/olcrtc-src/go.mod \
            buildScript/lib/protonvpn.sh \
            buildScript/lib/protonvpn-src \
            buildScript/lib/singbox-sidecar.sh \
            buildScript/lib/core/get_source_env.sh \
            buildScript/init/env.sh \
            buildScript/init/env_ndk.sh \
            libcore/build.sh \
            | sha1sum > sidecars_status
      - name: Sidecars Cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/executableSo
          key: ${{ hashFiles('.github/workflows/*', 'sidecars_status') }}-${{ env.MIERU_VERSION }}-${{ env.MDVPN_COMMIT }}-${{ env.NAIVE_VERSION }}-${{ env.OLCRTC_COMMIT }}-${{ env.PROTON_COMMIT }}-sidecars
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Mieru Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib mieru
      - name: MasterDnsVPN Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib masterdnsvpn
      - name: Naive Download
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib naive
      - name: olcRTC Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib olcrtc
      - name: Proton Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib protonvpn
      - name: Sing-box Sidecar Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib singbox-sidecar
      - name: Upload Sidecars
        uses: actions/upload-artifact@v7 # v7
        with:
          name: sidecars-so-build
          path: app/executableSo
          retention-days: 1
          if-no-files-found: error
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
      - sidecars
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download LibCore
        uses: actions/download-artifact@v8 # v8
        with:
          name: libcore-aar-build
          path: app/libs
      - name: Download Sidecars
        uses: actions/download-artifact@v8 # v8
        with:
          name: sidecars-so-build
          path: app/executableSo
      - name: Verify Sidecar Artifacts
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for so in libmieru.so libmasterdnsvpn.so libnaive.so libolcrtc.so libprotonvpn.so libsingbox.so; do
              if [ ! -f "app/executableSo/$abi/$so" ]; then
                echo "Error: missing app/executableSo/$abi/$so (sidecar artifact missing)" >&2
                exit 1
              fi
            done
          done
          # 「檔在」不等於「能用」：快取/artifact 還原出來的 .so 只要 .arch 跟目錄對不上，
          # Gradle 就不會把它塞進包裡，紅燈要等到驗產物那層才亮。在這裡先擋掉。
          bash ./scripts/check-sidecar-elf.sh app/executableSo
          ls -l app/executableSo/*/libprotonvpn.so
      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$ALIAS_NAME" ]; then
            echo "::error:: 未設定簽名憑證！請在 GitHub Secrets 中設定 KEYSTORE_BASE64 / KEYSTORE_PASS / ALIAS_NAME / ALIAS_PASS"
            exit 1
          fi
          
          echo "::notice:: 使用用戶自訂簽名 (alias=$ALIAS_NAME)"
          
          # 從 GitHub Secrets 還原 keystore 檔案
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          
          # 執行初始化腳本
          ./run init action gradle
          
          # 寫入簽名配置到 local.properties 供 Gradle 讀取
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> local.properties
          echo "ALIAS_NAME=$ALIAS_NAME" >> local.properties
          echo "ALIAS_PASS=$ALIAS_PASS" >> local.properties
          
          # 使用用戶自訂 keystore 簽名打包
          KEYSTORE_PASS="$KEYSTORE_PASS" ALIAS_NAME="$ALIAS_NAME" ALIAS_PASS="$ALIAS_PASS" \
            ./gradlew app:assembleOssRelease
          
          # 5. 尋找 APK 路徑並寫入環境變量
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV

      - name: Verify Proton sidecar in APKs
        # 「憑什麼要讓它缺席」：包裡每個 ABI 都要有 libprotonvpn.so，缺了 Proton
        # 取節點頁就不能用。前面的「Verify Sidecar Artifacts」只看下載到的 .so，
        # 這一層驗的是打包後的實物。
        shell: bash
        env:
          APK: ${{ env.APK }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=("$APK"/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::$APK 底下沒有任何 APK，無從驗起" >&2
            exit 1
          fi
          bash ./scripts/check-apk-sidecars.sh "${apks[@]}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NekoBoxs
          path: ${{ env.APK }}
