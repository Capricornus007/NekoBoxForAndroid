name: Update sing-box core

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: update-sing-box-core
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve latest maintained core
        id: core
        shell: bash
        run: |
          set -euo pipefail
          source buildScript/lib/core/get_source_env.sh
          latest=$(git ls-remote https://github.com/Capricornus007/sing-box.git refs/heads/1.15.x | cut -f1)
          test -n "$latest"
          echo "current=$COMMIT_SING_BOX" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$COMMIT_SING_BOX" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            sed -i -E "s/^(export COMMIT_SING_BOX=\").*(\")$/\1${latest}\2/" \
              buildScript/lib/core/get_source_env.sh
          fi

      - name: Bump the -mod counter in BOTH core-version records
        id: version
        run: |
          set -euo pipefail
          # 為什麼不再「跟著上游最新 tag 算基號」（2026-10-12 實測推翻舊做法）：
          #   bot 之前把基號設成上游最新的 v1.15.0-alpha.12，但 `git merge-base --is-ancestor`
          #   實測 alpha.12 **不在**我們 pin 的 3c9399de（也不在當時 tip 0e77408b）的祖先鏈上，
          #   也就是那顆二進位裡根本沒有 alpha.12 的內容——顯示出來就是謊言。
          #   看守 scripts/check-core-pins.sh 段 1c 因此把 run #58 判紅（它同時也只改了一處）。
          # 現在的規矩：
          #   1) 基號（vX.Y.Z-alpha.N）只有真的把上游那段併進來的人才抬，bot 不碰。
          #      抬基號時依用戶 2026-10-11 的裁定，`-mod` 計數歸 1（跨基線不累積）。
          #   2) bot 只負責：pin 有動 → `-mod.N` 遞增，而且**兩處一起寫**
          #      （nb4a.properties 的 SINGBOX_VERSION 是真正被 -X 注入二進位的那個；
          #       buildScript/lib/core/get_source_env.sh 的 VERSION_SING_BOX 是同一件事的另一份記錄）。
          #   3) pin 沒動就不改版本，避免無謂提交。
          ENV_FILE=buildScript/lib/core/get_source_env.sh
          current=$(grep -E '^SINGBOX_VERSION=' nb4a.properties | cut -d= -f2 | tr -d '\r[:space:]')
          current=${current#v}
          test -n "$current"
          base=$(printf '%s' "$current" | sed -E 's/-mod\.[0-9]+$//')
          n=$(printf '%s' "$current" | grep -oE -- '-mod\.[0-9]+$' | grep -oE '[0-9]+$' || true)
          if [ "${{ steps.core.outputs.changed }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo ">> pin 沒動，版本字串保持 $current"
            exit 0
          fi
          n=$(( ${n:-0} + 1 ))
          want="${base}-mod.${n}"
          echo ">> 版本字串：$current → $want（只抬 -mod，基號 $base 由人決定）"
          sed -i -E "s/^SINGBOX_VERSION=.*/SINGBOX_VERSION=v${want}/" nb4a.properties
          sed -i -E "s/^export VERSION_SING_BOX=.*/export VERSION_SING_BOX=\"${want}\"/" "$ENV_FILE"
          # 當場自證兩處一致，別再讓看守去發現第三遍
          a=$(grep -oP '^SINGBOX_VERSION=\K[^ ]+' nb4a.properties | tr -d '\r' | sed 's/^v//')
          b=$(grep -oP '^export VERSION_SING_BOX="\K[^"]+' "$ENV_FILE" | tr -d '\r')
          if [ "$a" != "$b" ]; then
            echo "::error::兩處版本字串寫完仍不一致：nb4a.properties=$a get_source_env.sh=$b"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      # Go 一律吃 feed 的 go-git = golang/go master tip（與用戶機同源），本檔不釘版本號。
      # 理由（為何不用 actions/setup-go、裝不到為什麼要紅）寫在該 composite 裡：
      # feed 倉 Capricornus007/repo 的 .github/actions/setup-feed-go。
      - name: Install Go from the feed (golang/go master tip)
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master

      - name: Build and verify LibCore
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        env:
          ALLOW_UNPINNED_SIBLINGS: "1"
        run: |
          ./run lib core
          bash ./scripts/verify-elf-alignment.sh app/libs/libcore.aar
          ./run init action gradle
          ./gradlew spotlessCheck testOssDebugUnitTest --no-daemon

      - name: Guard - sibling core pins must still agree with the new sing-box
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        run: bash ./scripts/check-core-pins.sh

      - name: Commit verified pin
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.core.outputs.latest }}
          CORE_CHANGED: ${{ steps.core.outputs.changed }}
          VERSION_CHANGED: ${{ steps.version.outputs.changed }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add buildScript/lib/core/get_source_env.sh nb4a.properties
          if [ "$CORE_CHANGED" = "true" ] && [ "$VERSION_CHANGED" = "true" ]; then
            msg="chore: follow sing-box 1.14.x ${LATEST:0:9}; sync displayed core version"
          elif [ "$CORE_CHANGED" = "true" ]; then
            msg="chore: follow sing-box 1.14.x ${LATEST:0:9}"
          else
            msg="chore: sync displayed core version with upstream release"
          fi
          git commit -m "$msg"
          git push origin HEAD:main

      - name: Dispatch signed builds
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref main
          gh workflow run ci.yml --ref main
