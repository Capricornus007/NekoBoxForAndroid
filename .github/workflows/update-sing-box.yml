name: Update sing-box core

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: update-sing-box-core
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve latest maintained core
        id: core
        shell: bash
        run: |
          set -euo pipefail
          source buildScript/lib/core/get_source_env.sh
          latest=$(git ls-remote https://github.com/Capricornus007/sing-box.git refs/heads/1.15.x | cut -f1)
          test -n "$latest"
          echo "current=$COMMIT_SING_BOX" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$COMMIT_SING_BOX" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            sed -i -E "s/^(export COMMIT_SING_BOX=\").*(\")$/\1${latest}\2/" \
              buildScript/lib/core/get_source_env.sh
          fi

      - name: Sync displayed core version with upstream release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # The displayed version must track the newest upstream release on the tracked
          # branch line, keeping the local -mod.N suffix so builds stay distinguishable
          # from official ones.
          #
          # Prefer the newest *stable* tag, but fall back to the newest tag of any kind
          # when the tracked line has no stable release yet. The fork tracks 1.15.x, and
          # upstream has only ever cut v1.15.0-alpha.* on that line (no v1.15.0 stable as
          # of 2026-09-18) — the old stable-only `grep -vE 'alpha|beta|rc'` filtered every
          # tag out, leaving $upstream empty and tripping `test -n` (run 35276186828, exit 1).
          # The fork already pins v1.15.0-alpha.4, so a pre-release line must resolve here.
          branch=$(grep -E '^SINGBOX_BRANCH=' nb4a.properties | cut -d= -f2 | tr -d '\r[:space:]')
          line=${branch%.x}
          all=$(git ls-remote --tags --refs https://github.com/SagerNet/sing-box.git "refs/tags/v${line}.*" \
            | sed 's#.*refs/tags/##' | sort -V)
          # `|| true` is load-bearing: the step runs under `set -euo pipefail`, so a
          # `grep` with no match aborts the whole assignment (that, not `test -n`, is
          # what killed run 35276186828 — the log shows exit 1 before any echo output).
          upstream=$(printf '%s\n' "$all" | { grep -vE 'alpha|beta|rc' || true; } | tail -n1)
          [ -n "$upstream" ] || upstream=$(printf '%s\n' "$all" | tail -n1)
          test -n "$upstream"
          current=$(grep -E '^SINGBOX_VERSION=' nb4a.properties | cut -d= -f2 | tr -d '\r[:space:]')
          mod=$(printf '%s' "$current" | grep -oE -- '-mod\.[0-9]+$' || true)
          want="${upstream}${mod}"
          echo "current=$current  upstream=$upstream  want=$want"
          if [ "$current" = "$want" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            sed -i -E "s/^SINGBOX_VERSION=.*/SINGBOX_VERSION=${want}/" nb4a.properties
          fi

      - name: Set up Java
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      - name: Build and verify LibCore
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        env:
          ALLOW_UNPINNED_SIBLINGS: "1"
        run: |
          ./run lib core
          bash ./scripts/verify-elf-alignment.sh app/libs/libcore.aar
          ./run init action gradle
          ./gradlew spotlessCheck testOssDebugUnitTest --no-daemon

      - name: Commit verified pin
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.core.outputs.latest }}
          CORE_CHANGED: ${{ steps.core.outputs.changed }}
          VERSION_CHANGED: ${{ steps.version.outputs.changed }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add buildScript/lib/core/get_source_env.sh nb4a.properties
          if [ "$CORE_CHANGED" = "true" ] && [ "$VERSION_CHANGED" = "true" ]; then
            msg="chore: follow sing-box 1.14.x ${LATEST:0:9}; sync displayed core version"
          elif [ "$CORE_CHANGED" = "true" ]; then
            msg="chore: follow sing-box 1.14.x ${LATEST:0:9}"
          else
            msg="chore: sync displayed core version with upstream release"
          fi
          git commit -m "$msg"
          git push origin HEAD:main

      - name: Dispatch signed builds
        if: steps.core.outputs.changed == 'true' || steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref main
          gh workflow run ci.yml --ref main
