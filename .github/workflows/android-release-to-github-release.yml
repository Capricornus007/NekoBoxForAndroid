name: Android Release APK

on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Leave empty to auto-generate.
        required: false
        type: string
      title:
        description: Release title. Leave empty to auto-generate.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NEKO_DEV_BUILD: ${{ github.ref_name == 'dev' && '1' || '0' }}
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
  ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
  ALIAS_PASS: ${{ secrets.ALIAS_PASS }}

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: libcore/go.sum
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install required Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-21" "platforms;android-35" "build-tools;35.0.1" "ndk;28.0.13004108"
          chmod +x gradlew buildScript/lib/core.sh buildScript/lib/core/init.sh buildScript/lib/core/build.sh buildScript/lib/core/get_source.sh libcore/init.sh libcore/build.sh
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASS" ] || [ -z "$ALIAS_NAME" ] || [ -z "$ALIAS_PASS" ]; then
              echo "KEYSTORE_BASE64 requires KEYSTORE_PASS, ALIAS_NAME and ALIAS_PASS."
              exit 1
            fi
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            rm -f release.keystore
          fi
      - name: Prepare pinned core dependencies and tools
        run: ./buildScript/lib/core/init.sh
      - name: Bundle pinned GeoIP and GeoSite databases
        run: ./buildScript/lib/assets.sh
      - name: Test two-database backup restore
        run: python3 buildScript/tests/test_restore_transaction.py
      - name: Check UI resources and fixed palette contrast
        run: python3 buildScript/tests/test_ui_resources.py
      - name: Test Go core with race detection
        working-directory: libcore
        env:
          NEKO_ROUTE_ASSET_TEST_DIR: ../app/src/main/assets/sing-box
        shell: bash
        run: go test -race -tags=with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api . github.com/sagernet/sing-box/protocol/group github.com/sagernet/sing-box/transport/wireguard github.com/sagernet/sing-box/protocol/http github.com/sagernet/sing-box/common/kmutex github.com/sagernet/sing-box/common/expiringmap github.com/sagernet/sing-box/common/dialer github.com/sagernet/sing-quic/congestion_meta2 github.com/sagernet/sing-box/protocol/vless/encryption 2>&1 | tee ../go-test.log
      - name: Build libcore AAR once
        run: ./buildScript/lib/core/build.sh
      - name: Test and build release APKs
        run: ./gradlew --no-daemon --no-build-cache -Pksp.incremental=false -Pkotlin.incremental=false -Pkotlin.compiler.execution.strategy=in-process :app:testOssReleaseUnitTest :app:assembleOssRelease
      - name: Verify and collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          python3 .github/scripts/verify_apks.py app/build/outputs/apk/oss/release release-assets/APK-VERIFICATION.json
          cp app/build/outputs/apk/oss/release/*.apk release-assets/
          python3 .github/scripts/build_manifest.py release-assets/BUILD-MANIFEST.json release-assets/APK-VERIFICATION.json
          (cd release-assets && sha256sum *.apk BUILD-MANIFEST.json APK-VERIFICATION.json > SHA256SUMS.txt)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            go-test.log
          if-no-files-found: ignore
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apks
          path: release-assets/
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties)
          TAG=${INPUT_TAG:-v${VERSION_NAME}-${GITHUB_RUN_NUMBER}}
          TITLE=${INPUT_TITLE:-NekoBox_SF ${VERSION_NAME}}
          git check-ref-format "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          Package: com.isaiandco.neko. Release APKs for four ABIs; non-debuggable. Signing uses the repository private key only when configured, otherwise the existing stable development certificate.

          dev.16 adds optional configured-DNS and HTTPS health checks to Fastest profiles. The actual typed DNS transport (including bootstrap, TLS, path and headers) is copied per candidate, A/AAAA are checked separately, and verified HTTPS uses the resulting addresses through the same candidate. There is no implicit direct or alternate-DNS retry. Up to three checks run concurrently; each is bounded by 18 seconds. Waiting for the first healthy node at startup is also capped at 18 seconds; ranking continues in the service context. Existing profiles keep the previous behavior until enabled.

          An independent cooldown option pauses a node after three confirmed probe failures, with a 30-second to 10-minute backoff and retries on the next scheduled check. A network change invalidates both failures and old successful checks. Cancellation on screen lock/Doze is not counted as a failure; failure-triggered checks are throttled to one per 15 seconds.

          Diagnostics can compare up to eight concrete nodes using one configured DNS server and HTTPS endpoint. It reports bootstrap, A/AAAA, TCP, TLS and HTTP status without changing the running profile or exposing DNS headers, URL paths or returned IPs. Direct control-site results show timestamp, age, quorum, timeout and failure reason, including a distinct cancelled state. Routing menu checks exact duplicates and provable domain-rule shadowing and opens either rule; custom JSON and complex IP/rule-set relationships are not guessed.

          Protocol filtering from dev.15 is retained for both manual and regex candidates, including every chain hop and group front/landing proxies. Save and restart the active profile to apply new profile options.

          Local validation passed: 127 JVM tests, native race tests, UI resource checks and SQLite restore tests.

          Regression coverage includes a real configured DoH/TLS exchange through two distinct candidates (ordinary URLTest passes the candidate whose DoH path is broken), A/AAAA, NXDOMAIN, HTTP block pages, secret redaction, screen-lock cancellation, cooldown/recovery and network changes. Existing Hysteria2 client/server, TUN UID-boundary, DNS bootstrap and WG/AWG tests remain. These fixtures do not reproduce a user's whitelist network or establish remote-server reachability.

          dev.14.1 fixes scrollbar jumps in routes, profiles and other shared lists. Progress now follows visible rows with variable card heights, margins and grid spans. Dragging uses the same padded track as drawing; the target is aligned using its actual laid-out height, including a final card taller than the viewport. Capturing the thumb prevents an accidental group-page swipe. Existing thumb styling, animations and application-name section popups are retained without adding a dependency.

          Diagnostics now retains the last ten minutes at debug/trace level. Application/full UID, domain and node filters search the entire retained window; older/latest page actions keep Android IPC bounded. Expiration is lazy and needs no cleanup timer. A visible notice reports early eviction if the 16,384-event/8 MiB safety budget is reached.

          Screen-off, keyguard lock and Doze pause health checks, including control-site fallback and fastest/priority groups. Active checks and explicit DNS/UDP/TCP/TLS/MTU probes are cancelled without recording a failed fallback round. Unlock resumes active group checks. This screen-lock policy does not bring down the VPN device. Traffic polling slows to at least 30 seconds while locked/idle and refreshes immediately on power/keyguard events; cumulative totals are preserved. Existing transport keepalives and deferrable subscription updates remain.

          Audited all application activities, 50 layouts, 23 preference schemas and code-built screens against Material 3 Expressive guidance. Shared app bars preserve toolbar space below status insets; dark blue/green/pink palettes use matching night color roles. Controls grow for large text with 48dp minimum targets, group labels no longer compete horizontally, and remaining themed application dialogs use Material builders. The JSON toolbar has 48dp labelled actions and a scrollable symbol strip; STUN uses an outlined field, semantic surfaces and a primary action. No new UI runtime dependency or decorative animation was added.

          All changes remain in dev. JVM/native race tests, DNS bootstrap and route/TUN/WG/AWG regressions, SQLite restore, resource/contrast checks, four-ABI signature and 16 KiB APK verification run before publication. See docs/M3-EXPRESSIVE-AUDIT.md for the screen audit and physical-device checklist. No device/emulator was attached during development; rendered UI, TalkBack, OEM lock/wake and work-profile behavior still require device validation.
          NOTES
          OPTIONS=()
          if [ "$NEKO_DEV_BUILD" = 1 ]; then OPTIONS+=(--prerelease --latest=false); fi
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.txt "${OPTIONS[@]}"
