name: Android release to GitHub Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Leave empty to auto-generate.
        required: false
        type: string
      title:
        description: Release title. Leave empty to auto-generate.
        required: false
        type: string
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: android-release-github-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Go 一律吃 feed 的 go-git = golang/go master tip（與用戶機同源），本檔不釘版本號。
      # 理由（為何不用 actions/setup-go、裝不到為什麼要紅）寫在該 composite 裡：
      # feed 倉 Capricornus007/repo 的 .github/actions/setup-feed-go。
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master

      # composite 不管 module 快取。原本這層快取是 setup-go 的 cache-dependency-path 給的，
      # 依賴清單照抄（libcore/go.sum + libcore/go.mod），不要因為換工具鏈來源就把它弄丟。
      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-mod-${{ hashFiles('libcore/go.sum', 'libcore/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;25.0.8775105"

      - name: Make scripts executable
        run: |
          chmod +x ./gradlew ./run
          chmod +x buildScript/lib/core.sh buildScript/lib/core/init.sh buildScript/lib/core/build.sh
          chmod +x buildScript/lib/core/get_source.sh buildScript/init/env.sh buildScript/init/env_ndk.sh
          chmod +x buildScript/init/action/gradle.sh
          chmod +x libcore/init.sh libcore/build.sh

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' nb4a.properties | cut -d= -f2-)
          DEFAULT_TAG="v${VERSION_NAME}-${GITHUB_RUN_NUMBER}"
          DEFAULT_TITLE="NekoBox_SF ${VERSION_NAME}"

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TITLE="${{ github.event.release.name }}"
            if [ -z "$TITLE" ]; then
              TITLE="$DEFAULT_TITLE"
            fi
          else
            TAG='${{ inputs.tag }}'
            TITLE='${{ inputs.title }}'
            if [ -z "$TAG" ]; then
              TAG="$DEFAULT_TAG"
            fi
            if [ -z "$TITLE" ]; then
              TITLE="$DEFAULT_TITLE"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Build libcore AAR
        run: ./buildScript/lib/core.sh

      - name: Verify libcore AAR exists
        run: test -f app/libs/libcore.aar

      # 2026-10-25 修：這條鏈產出的是 debug 版（com.nb4a.debug，使用者實測那顆），
      # 原本直接 ./gradlew 跳過了 assets 下載，導致 APK 內完全沒有 assets/sing-box/，
      # 裝到手機後 libcore 解不出 geoip/geosite → "bad asset" → sing-box 解析不了
      # geosite:cn/geoip:cn → 隧道起不來、上下傳速度 0。
      # 其他四條鏈（build/release/ci/preview）都是靠 `./run init action gradle`
      # 間接呼叫 buildScript/lib/assets.sh 下載，唯獨這條漏了。補回來。
      - name: Download geoip/geosite assets (sing-box rule sets)
        run: ./run init action gradle

      - name: Verify assets are present before packaging
        run: |
          test -f app/src/main/assets/sing-box/geoip.db.xz || { echo "::error::geoip.db.xz 沒下載到，APK 會缺 rule-set 資料庫"; exit 1; }
          test -f app/src/main/assets/sing-box/geosite.db.xz || { echo "::error::geosite.db.xz 沒下載到，APK 會缺 rule-set 資料庫"; exit 1; }

      - name: Build installable OSS debug APK
        run: ./gradlew --no-daemon :app:assembleOssDebug

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk/oss/debug -type f -name "*.apk" -print -exec cp -v {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -name "*.apk" -print -quit)" || { echo "No OSS debug APK files found"; exit 1; }
          (
            cd release-assets
            sha256sum *.apk > SHA256SUMS.txt
          )

      - name: Verify APK signatures (release gate)
        # 規則 71：公開發布的 APK 一律要 v1+v2+v3，而且只認產物、不認 gradle 配置。
        # 這條是 debug 通道（assembleOssDebug），所以不設 REQUIRE_RELEASE_KEY，
        # 但「完全沒簽」「少某個 scheme」「apksigner 找不到」都要讓 workflow 紅。
        shell: bash
        run: bash ./scripts/check-apk-signature.sh release-assets/*.apk

      - name: Verify Proton sidecar in APKs (release gate)
        # 「憑什麼要讓它缺席」：這顆包是公開掛到 GitHub Release 上的實物，裡面每個 ABI
        # 都要有 libprotonvpn.so，缺了 Proton 取節點頁就完全不能用，寧可讓 workflow 紅。
        shell: bash
        run: bash ./scripts/check-apk-sidecars.sh release-assets/*.apk

      - name: Create release when started manually
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ steps.meta.outputs.tag }}" \
              --title "${{ steps.meta.outputs.title }}" \
              --notes "Automated Android release build uploaded by GitHub Actions."
          fi

      - name: Upload APKs to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" release-assets/* --clobber
