name: Android Release APK

on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Leave empty to auto-generate.
        required: false
        type: string
      title:
        description: Release title. Leave empty to auto-generate.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NEKO_DEV_BUILD: ${{ github.ref_name == 'dev' && '1' || '0' }}
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
  ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
  ALIAS_PASS: ${{ secrets.ALIAS_PASS }}

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: libcore/go.sum
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install required Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-21" "platforms;android-35" "build-tools;35.0.1" "ndk;28.0.13004108"
          chmod +x gradlew buildScript/lib/core.sh buildScript/lib/core/init.sh buildScript/lib/core/build.sh buildScript/lib/core/get_source.sh libcore/init.sh libcore/build.sh
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEYSTORE_PASS" && test -n "$ALIAS_NAME" && test -n "$ALIAS_PASS"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          elif [ "$NEKO_DEV_BUILD" != 1 ]; then
            echo "A private release signing key is required outside dev."
            exit 1
          fi
      - name: Prepare pinned core dependencies and tools
        run: ./buildScript/lib/core/init.sh
      - name: Bundle pinned GeoIP and GeoSite databases
        run: ./buildScript/lib/assets.sh
      - name: Test two-database backup restore
        run: python3 buildScript/tests/test_restore_transaction.py
      - name: Test Go core with race detection
        working-directory: libcore
        env:
          NEKO_ROUTE_ASSET_TEST_DIR: ../app/src/main/assets/sing-box
        shell: bash
        run: go test -race -tags=with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api . github.com/sagernet/sing-box/protocol/group 2>&1 | tee ../go-test.log
      - name: Build libcore AAR once
        run: ./buildScript/lib/core/build.sh
      - name: Test and build release APKs
        run: ./gradlew --no-daemon --no-build-cache -Pksp.incremental=false -Pkotlin.incremental=false -Pkotlin.compiler.execution.strategy=in-process :app:testOssReleaseUnitTest :app:assembleOssRelease
      - name: Verify and collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          python3 .github/scripts/verify_apks.py app/build/outputs/apk/oss/release release-assets/APK-VERIFICATION.json
          cp app/build/outputs/apk/oss/release/*.apk release-assets/
          python3 .github/scripts/build_manifest.py release-assets/BUILD-MANIFEST.json release-assets/APK-VERIFICATION.json
          (cd release-assets && sha256sum *.apk BUILD-MANIFEST.json APK-VERIFICATION.json > SHA256SUMS.txt)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            go-test.log
          if-no-files-found: ignore
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apks
          path: release-assets/
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties)
          TAG=${INPUT_TAG:-v${VERSION_NAME}-${GITHUB_RUN_NUMBER}}
          TITLE=${INPUT_TITLE:-NekoBox_SF ${VERSION_NAME}}
          git check-ref-format "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          Package: com.isaiandco.neko (without .debug). Export a backup from the old app and import it into this package before uninstalling the old app.

          Development builds use the repository's public test signing key unless private CI signing is configured. APKs are non-debuggable release builds. BUILD-MANIFEST.json records the actual signer, source and toolchain; SHA256SUMS.txt records asset hashes.

          Fixes official GeoIP updates and first-run geo routing with checksum-verified bundled GeoIP/GeoSite databases. Session traffic keeps updating when speed display is disabled; dynamic group candidates retain their own TCP/UDP traffic. Includes optional proxy-only subscription/route updates and password-encrypted local/shared/WebDAV backups. Backup restoration commits profiles, routes and settings through one SQLite connection.

          Generated DNS configurations now use typed DNS/FakeIP servers, explicit remote proxy detours and domain_resolver. IPv4/IPv6 strategies and custom resolver overrides are preserved. Platform DNS callbacks complete promptly; DoH/H3 URL query parameters are preserved. Full user JSON configurations remain user-managed.

          Fixes AWG header/signature corruption by WG reserved-byte rewriting, configures AWG parameters before interface startup and synchronizes socket creation. Supports AWG parameters on the modern WireGuard endpoint path as well as legacy outbounds. Invalid numeric and multiline parameters are rejected; startup errors no longer contain the private-key IPC configuration.

          JVM, Go race, real database, DNS routing, two-peer WG/AWG/AWG2, TCP/UDP and two-file restore tests run in this pipeline. Physical-device VPN/DNS/battery behavior, the system-stack packet-handler path and all AWG variants remain outside these checks.
          NOTES
          OPTIONS=()
          if [ "$NEKO_DEV_BUILD" = 1 ]; then OPTIONS+=(--prerelease --latest=false); fi
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.txt "${OPTIONS[@]}"
