name: Android Release APK

on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Leave empty to auto-generate.
        required: false
        type: string
      title:
        description: Release title. Leave empty to auto-generate.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NEKO_DEV_BUILD: ${{ github.ref_name == 'dev' && '1' || '0' }}
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
  ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
  ALIAS_PASS: ${{ secrets.ALIAS_PASS }}

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: libcore/go.sum
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install required Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-21" "platforms;android-35" "build-tools;35.0.1" "ndk;28.0.13004108"
          chmod +x gradlew buildScript/lib/core.sh buildScript/lib/core/init.sh buildScript/lib/core/build.sh buildScript/lib/core/get_source.sh libcore/init.sh libcore/build.sh
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASS" ] || [ -z "$ALIAS_NAME" ] || [ -z "$ALIAS_PASS" ]; then
              echo "KEYSTORE_BASE64 requires KEYSTORE_PASS, ALIAS_NAME and ALIAS_PASS."
              exit 1
            fi
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            rm -f release.keystore
          fi
      - name: Prepare pinned core dependencies and tools
        run: ./buildScript/lib/core/init.sh
      - name: Bundle pinned GeoIP and GeoSite databases
        run: ./buildScript/lib/assets.sh
      - name: Test two-database backup restore
        run: python3 buildScript/tests/test_restore_transaction.py
      - name: Test Go core with race detection
        working-directory: libcore
        env:
          NEKO_ROUTE_ASSET_TEST_DIR: ../app/src/main/assets/sing-box
        shell: bash
        run: go test -race -tags=with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api . github.com/sagernet/sing-box/protocol/group github.com/sagernet/sing-box/protocol/http github.com/sagernet/sing-box/common/kmutex github.com/sagernet/sing-box/common/expiringmap github.com/sagernet/sing-box/common/dialer github.com/sagernet/sing-quic/congestion_meta2 github.com/sagernet/sing-box/protocol/vless/encryption 2>&1 | tee ../go-test.log
      - name: Build libcore AAR once
        run: ./buildScript/lib/core/build.sh
      - name: Test and build release APKs
        run: ./gradlew --no-daemon --no-build-cache -Pksp.incremental=false -Pkotlin.incremental=false -Pkotlin.compiler.execution.strategy=in-process :app:testOssReleaseUnitTest :app:assembleOssRelease
      - name: Verify and collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          python3 .github/scripts/verify_apks.py app/build/outputs/apk/oss/release release-assets/APK-VERIFICATION.json
          cp app/build/outputs/apk/oss/release/*.apk release-assets/
          python3 .github/scripts/build_manifest.py release-assets/BUILD-MANIFEST.json release-assets/APK-VERIFICATION.json
          (cd release-assets && sha256sum *.apk BUILD-MANIFEST.json APK-VERIFICATION.json > SHA256SUMS.txt)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            go-test.log
          if-no-files-found: ignore
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apks
          path: release-assets/
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties)
          TAG=${INPUT_TAG:-v${VERSION_NAME}-${GITHUB_RUN_NUMBER}}
          TITLE=${INPUT_TITLE:-NekoBox_SF ${VERSION_NAME}}
          git check-ref-format "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          Package: com.isaiandco.neko. Non-debuggable release APKs for four ABIs. Private signing is selected when KEYSTORE_BASE64 and its password/alias secrets are configured; otherwise the existing stable debug key is retained. Incomplete or invalid private signing configuration fails. Android requires a data transfer/reinstall when changing signing keys.

          Updates AmneziaWG to the official v3.1.20260828 module (b5928efb6ca19f0153958460c3d141f04abc5c2e), with native support, profile editor and INI/packed Amnezia import for all AWG 3.1 options: header protection, content padding, handshake/keepalive ranges, random trailers and cookie control. PersistentKeepalive accepts a single value or range. Existing WG/AWG/AWG2 profiles remain readable.

          Fixes first-packet delivery with S4 padding by applying initial IPC before the TUN reader consumes data. Invalid CPS startup returns an error without blocking shutdown. Header protection keys are hidden in editor summaries and diagnostic output; invalid key/range settings are rejected.

          Retains sing-box 1.14.3, DNS/UID routing protection, optional direct-route fallback, verified bundled GeoIP/GeoSite, traffic counters, backups, groups and existing protocol adapters from dev.7.

          Native race tests include first-packet and bidirectional exchange across WG/AWG/AWG2/AWG3/AWG3.1, invalid IPC shutdown, XHTTP, HTTP/2 CONNECT, Juicity and VLESS encryption. JVM tests cover imports, all new options and legacy profile serialization. SQLite rollback and APK signature/ABI/16 KiB checks run before publication. OEM/work-profile/Private DNS and battery behavior still require device testing. WireGuard retains the existing TCP/UDP adapter; upstream's direct L3/ICMP port is a separate remaining task.
          NOTES
          OPTIONS=()
          if [ "$NEKO_DEV_BUILD" = 1 ]; then OPTIONS+=(--prerelease --latest=false); fi
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.txt "${OPTIONS[@]}"
