name: Android Release APK

on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Leave empty to auto-generate.
        required: false
        type: string
      title:
        description: Release title. Leave empty to auto-generate.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NEKO_DEV_BUILD: ${{ github.ref_name == 'dev' && '1' || '0' }}
  KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
  ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
  ALIAS_PASS: ${{ secrets.ALIAS_PASS }}

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: libcore/go.sum
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install required Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-21" "platforms;android-35" "build-tools;35.0.1" "ndk;28.0.13004108"
          chmod +x gradlew buildScript/lib/core.sh buildScript/lib/core/init.sh buildScript/lib/core/build.sh buildScript/lib/core/get_source.sh libcore/init.sh libcore/build.sh
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASS" ] || [ -z "$ALIAS_NAME" ] || [ -z "$ALIAS_PASS" ]; then
              echo "KEYSTORE_BASE64 requires KEYSTORE_PASS, ALIAS_NAME and ALIAS_PASS."
              exit 1
            fi
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            rm -f release.keystore
          fi
      - name: Prepare pinned core dependencies and tools
        run: ./buildScript/lib/core/init.sh
      - name: Bundle pinned GeoIP and GeoSite databases
        run: ./buildScript/lib/assets.sh
      - name: Test two-database backup restore
        run: python3 buildScript/tests/test_restore_transaction.py
      - name: Check UI resources and fixed palette contrast
        run: python3 buildScript/tests/test_ui_resources.py
      - name: Test Go core with race detection
        working-directory: libcore
        env:
          NEKO_ROUTE_ASSET_TEST_DIR: ../app/src/main/assets/sing-box
        shell: bash
        run: go test -race -tags=with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api . github.com/sagernet/sing-box/protocol/group github.com/sagernet/sing-box/transport/wireguard github.com/sagernet/sing-box/protocol/http github.com/sagernet/sing-box/common/kmutex github.com/sagernet/sing-box/common/expiringmap github.com/sagernet/sing-box/common/dialer github.com/sagernet/sing-quic/congestion_meta2 github.com/sagernet/sing-box/protocol/vless/encryption 2>&1 | tee ../go-test.log
      - name: Build libcore AAR once
        run: ./buildScript/lib/core/build.sh
      - name: Test and build release APKs
        run: ./gradlew --no-daemon --no-build-cache -Pksp.incremental=false -Pkotlin.incremental=false -Pkotlin.compiler.execution.strategy=in-process :app:testOssReleaseUnitTest :app:assembleOssRelease
      - name: Verify and collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          python3 .github/scripts/verify_apks.py app/build/outputs/apk/oss/release release-assets/APK-VERIFICATION.json
          cp app/build/outputs/apk/oss/release/*.apk release-assets/
          python3 .github/scripts/build_manifest.py release-assets/BUILD-MANIFEST.json release-assets/APK-VERIFICATION.json
          (cd release-assets && sha256sum *.apk BUILD-MANIFEST.json APK-VERIFICATION.json > SHA256SUMS.txt)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            go-test.log
          if-no-files-found: ignore
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apks
          path: release-assets/
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties)
          TAG=${INPUT_TAG:-v${VERSION_NAME}-${GITHUB_RUN_NUMBER}}
          TITLE=${INPUT_TITLE:-NekoBox_SF ${VERSION_NAME}}
          git check-ref-format "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          dev.13.1 fixes the TextInputLayout ClassCastException when opening diagnostics and the network-policy editor, including diagnostic filters. Diagnostics now has a dedicated navigation-drawer entry for the active/selected profile and a direct item in each profile's overflow menu; it is removed from Share → Configuration. The adb diagnostics smoke scenario now asserts the form opens, rather than only checking that the process survives.

          Package: com.isaiandco.neko. Non-debuggable release APKs for four ABIs. Private signing is selected when KEYSTORE_BASE64 and its password/alias secrets are configured; otherwise the existing stable debug key is retained. Incomplete or invalid private signing configuration fails. Android requires a data transfer/reinstall when changing signing keys.

          Adds a full-screen, visible-only live diagnostics view with application/full UID, domain and node filters. Routing/DNS connection history is bounded and remains debug/trace only. Group selection, WG/AWG handshake/RX/TX and fallback per-site results and failure/recovery counters are shown separately. Secondary actions and grouped surfaces follow Material 3 Expressive guidance.

          Explicit protected-core checks compare direct/current proxy UDP DNS, UDP response, TCP dial and verified TLS. WG/AWG IPv4/IPv6 echo probes report the largest verified inner packet size without changing MTU or replacing the TUN return owner. No reply means unknown; this is not an outer UDP PMTU measurement. Other outbounds report unsupported ICMP size checks.

          Direct routes can inherit global behavior, stay always direct, fall back to the current proxy or use a separate backup profile. Route DNS follows the same fallback; endpoint/control bootstrap remains independent and local addresses remain direct. Existing routes retain previous defaults after the schema 7→8 migration.

          Manual subscription updates show additions/removals and changed field categories before applying, with credentials hidden. One private undo point per subscription restores profiles and stable IDs while retaining overlapping traffic counters. Referenced added nodes are protected; updates and undo share a reservation and validate concurrent edits. Unchanged refreshes do not overwrite the undo point.

          Optional mobile/Wi-Fi/Ethernet policies choose profile and DNS on start/network changes; exact SSID takes precedence over generic Wi-Fi. DNS overrides do not rewrite global settings. On Android 10+, optional SSID matching requires precise location access allowed all the time and system Location enabled. Without it generic transport policies work normally. Full custom JSON retains its own DNS.

          Retains the work-profile/TUN isolation fix, official AmneziaWG v3.1.20260828, existing TCP/UDP handling, bundled GeoIP/GeoSite and conditional private signing. No configuration reimport is required. JVM, native race, SQLite, signature/ABI and 16 KiB APK checks run before publication. A local adb smoke runner and device regression checklist cover network changes, sleep/wake and package UID refresh; physical Android/work-profile and real-network assertions still require device testing.
          NOTES
          OPTIONS=()
          if [ "$NEKO_DEV_BUILD" = 1 ]; then OPTIONS+=(--prerelease --latest=false); fi
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.txt "${OPTIONS[@]}"
