name: Preview Build
on:
  push:
    paths:
      - 'nb4a.properties'
  workflow_dispatch:
    inputs:
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      # Go 一律吃 feed 的 go-git = golang/go master tip（與用戶機同源）。
      # 為什麼不用 actions/setup-go、裝不到為什麼要紅：理由寫在該 composite 裡
      # （feed 倉 Capricornus007/repo 的 .github/actions/setup-feed-go），各倉不重複抄。
      # composite 只適用 Linux x86_64，本倉所有 job 都是 ubuntu-latest，符合。
      - name: Install Go from the feed (golang/go master tip)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify LibCore API classes
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v7
        with:
          name: libcore-aar-preview
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 1
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download LibCore AAR
        uses: actions/download-artifact@v8
        with:
          name: libcore-aar-preview
          path: app/libs
      - name: Verify downloaded LibCore API classes
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      # 這條鏈沒有 sidecars job，而 preBuild 的 buildProtonvpn 缺 .so 就會自己編，
      # 所以這個 job 自己也要裝 Go（版本由 feed 的 composite 決定 = golang/go master tip，
      # 不在本檔釘版本號）：缺了編譯直接失敗、建置就紅（libprotonvpn.so 不允許缺席）。
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          
          # Sign unsigned APKs with fixed debug keystore if available, otherwise fallback to dynamic generation
          KEYSTORE_PATH="debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Using fixed debug keystore from repository..."
          else
            echo "WARNING: Fixed debug keystore not found at $KEYSTORE_PATH!"
            echo "Please run the 'Initialize Debug Keystore' workflow first."
            echo "Falling back to dynamic debug.keystore generation..."
            KEYSTORE_PATH="$HOME/.android/debug.keystore"
            if [ ! -f "$KEYSTORE_PATH" ]; then
              mkdir -p ~/.android
              keytool -genkey -v -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Using apksigner: $APKSIGNER"
          
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK_DIR=$(dirname $APK)
          
          echo "Signing APKs in $APK_DIR..."
          for apk in "$APK_DIR"/*-unsigned.apk; do
            if [ -f "$apk" ]; then
              signed_apk="${apk%-unsigned.apk}-debug-signed.apk"
              echo "Signing $apk -> $signed_apk"
              $APKSIGNER sign --ks "$KEYSTORE_PATH" --ks-pass pass:android --key-pass pass:android --out "$signed_apk" "$apk"
              rm "$apk"
            fi
          done
          
          echo "APK=$APK_DIR" >> $GITHUB_ENV
      - name: Verify Proton sidecar in APKs
        # 「憑什麼要讓它缺席」：包裡有幾個 ABI，每個 ABI 都要有一支 libprotonvpn.so，
        # 缺了 Proton 取節點頁就不能用，這種包不要上傳。
        shell: bash
        env:
          APK: ${{ env.APK }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=("$APK"/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::$APK 底下沒有任何 APK，無從驗起" >&2
            exit 1
          fi
          bash ./scripts/check-apk-sidecars.sh "${apks[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: ${{ env.APK }}
