# NB4A sing-box upstream switch
#
# Edit SING_BOX_UPSTREAM, then apply:
#   bash buildScript/lib/core/switch_upstream.sh
# or pass the name directly (also rewrites this file):
#   bash buildScript/lib/core/switch_upstream.sh starifly
#   bash buildScript/lib/core/switch_upstream.sh ref1nd
#
# get_source.sh calls switch_upstream.sh so a normal source fetch also applies it.
# Env var SING_BOX_UPSTREAM overrides this file when already set.
#
# Values:
#   ref1nd   -> ../sing-box.ref1nd   (https://github.com/reF1nd/sing-box)
#   starifly -> ../sing-box.starifly (https://github.com/starifly/sing-box)
#
# go.mod replace always targets ../sing-box (symlink to the active tree).

SING_BOX_UPSTREAM=starifly
